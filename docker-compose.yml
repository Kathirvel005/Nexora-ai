version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./nexora.db
      - JWT_SECRET=supersecretjwtkey_replace_this_in_production
      - JWT_REFRESH_SECRET=supersecretjwtrefreshkey_replace_this_in_production
    volumes:
      - ./nexora.db:/workspace/nexora.db

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
